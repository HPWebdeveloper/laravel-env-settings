name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} • L${{ matrix.laravel }} • deps=${{ matrix.deps }} • OS=${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ["8.1", "8.2", "8.3"]
        laravel: ["10", "11", "12"]
        deps: [lowest, highest]
        exclude:
          # Laravel 11 requires PHP >= 8.2
          - php: "8.1"
            laravel: "11"
          # Laravel 12 assumed requires PHP >= 8.3
          - php: "8.1"
            laravel: "12"
          - php: "8.2"
            laravel: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo, sqlite3, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pin Laravel/Testbench for matrix
        shell: bash
        run: |
          LARAVEL="${{ matrix.laravel }}"
          case "$LARAVEL" in
            10) TESTBENCH="^8.0" ;;
            11) TESTBENCH="^9.0" ;;
            12) TESTBENCH="^10.0" ;;
            *) echo "Unsupported Laravel version: $LARAVEL" ; exit 1 ;;
          esac
          echo "Using illuminate/support:^${LARAVEL}.0 and orchestra/testbench:${TESTBENCH}"
          composer require "illuminate/support:^${LARAVEL}.0" "orchestra/testbench:${TESTBENCH}" --no-interaction --no-update

      - name: Get Composer cache directory
        shell: bash
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer files
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.deps }}-
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: "Install dependencies (matrix: ${{ matrix.deps }})"
        shell: bash
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --no-progress --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Run test suite
        run: composer test

      - name: Check test inventory docs up-to-date
        shell: bash
        run: |
          set -euo pipefail
          # Generate the latest test inventory
          composer docs:tests
          # Fail if docs/tests.md changed compared to the committed version
          if ! git diff --quiet -- docs/tests.md; then
            echo "::error title=Out-of-date test inventory::docs/tests.md is not up-to-date." >&2
            echo "Run the following locally and commit the result:" >&2
            echo "  composer docs:tests && git add docs/tests.md && git commit -m 'chore(docs): update test inventory'" >&2
            echo "\nChanges:" >&2
            git --no-pager diff -- docs/tests.md || true
            exit 1
          fi
