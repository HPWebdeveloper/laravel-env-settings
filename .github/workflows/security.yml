name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Run composer audit
        env:
          # Throttle parallel HTTP downloads to reduce GitHub codeload 429s.
          COMPOSER_MAX_PARALLEL_HTTP: 6
        run: |
          set -euo pipefail
          composer validate --strict
          if [ -f composer.lock ]; then
            # Applications commit composer.lock, so the lock file can be
            # audited directly without installing anything.
            composer audit --locked --no-interaction
          else
            # Libraries do not commit composer.lock. `composer audit` reads
            # installed packages, so dependencies have to be resolved first
            # or it exits with "No installed packages found".
            composer update --no-interaction --prefer-dist --no-progress
            composer audit --no-interaction
          fi
